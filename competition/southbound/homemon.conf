# ============================================================================
# homemon 配置 —— 依据 2026-10-09 真机实测（详见 README 第四节）
# 扩展口 J9903(P101-2x10SGF01) 实测引脚：
#   引脚5  = GPIO3_C5 → sysfs gpio 117
#   引脚12 = GPIO3_C2 → sysfs gpio 114
#   引脚15 = GPIO0_D5 → sysfs gpio  29
#   引脚2/4= GPIO3_B2/B1（默认是 UART4_TX/RX，需 pinmux 为 GPIO 才能当输入）
#   引脚6/8/10 = SARADC VIN4/5/6 → /sys/bus/iio/devices/iio:device0/in_voltage{4,5,6}_raw
#   引脚11/13  = I2C3_SCL/SDA → /dev/i2c-3
# ============================================================================

# --- 红外人体传感器（HC-SR501，数字高电平有效）---
motion_gpio=117,114

# --- 门磁（常闭/常开按实际接线调整 motion_active_high）---
door_gpio=29
motion_active_high=1

# --- 随身无线求助按钮（433M 接收模块数据脚；若暂未接可置 -1）---
button_gpio=106
button_active_high=1

# --- 有源蜂鸣器（声报警）---
buzzer_gpio=105

# --- 温湿度 SHT30（I2C3）---
i2c_dev=/dev/i2c-3
i2c_addr=0x44

# --- 燃气 / 烟雾（SARADC，扩展口 J9903 引脚 6/8/10 = VIN4/5/6）---
# 实测基线：悬空时读数为 1023/995/999（10bit 满量程）
# 接上 MQ-2/MQ-5 后：洁净空气约数百，气体浓度升高时上升 → 阈值取"基线 + 余量"
adc_dev=0
gas_adc_ch=4
smoke_adc_ch=5
gas_alarm_raw=800
smoke_alarm_raw=800
# 台架调试（未接传感器）时可临时把阈值设为 1024 以避免悬空误报

# --- 三色灯：实测名字就是 red/green/blue ---
led_red=/sys/class/leds/red
led_green=/sys/class/leds/green
led_blue=/sys/class/leds/blue

# --- 语音播报（首选内置 OHAudio，本项为降级命令）---
say_cmd=/data/homemon/say.sh "%s"

# --- 阈值：正式演示用（30 分钟无活动告警）---
no_motion_sec=1800
warn_ratio=60
temp_high=30
temp_low=10
rh_high=75
rh_low=25

# --- 运行参数 ---
tick_sec=1
report_every_sec=10
dir=/data/homemon

# ============================================================================
# 快速联调配置（需要缩短等待时另存为 homemon-demo.conf，30 秒即触发告警）
