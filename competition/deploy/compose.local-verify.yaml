# deploy/compose.local-verify.yaml
#
# 本机（Windows 开发机）Docker 验收专用 override。
# **不要**在公网 Linux 主机上使用本文件。
#
# ---------------------------------------------------------------------------
# 为什么需要它
# ---------------------------------------------------------------------------
# 1. 本机 0.0.0.0:80 与 0.0.0.0:443 已被其它进程占用，正式 compose 的
#    "80:80" / "443:443" 在本机会因端口冲突而 bind 失败。
# 2. 本机没有正式域名，也没有证书。验收时把 PUBLIC_DOMAIN 设为 localhost：
#    Caddy 对 localhost 自动改用**内部本地 CA**签发证书，
#    不会向任何公共 ACME CA 发起申请（避免消耗 CA 配额，也避免误导成
#    "已取得公网证书"）。
#
# 本文件只改"主机侧监听地址与端口"，不改任何 HTTPS 语义：
#   - Caddy 仍然对 HTTP 做 308 跳转到 HTTPS；
#   - TLS 仍然由 Caddy 终止，仅暴露 80/443 两个入口；
#   - backend 仍然**不发布任何主机端口**，只能经 caddy 反代访问；
#   - 正式 compose.public.yaml 与正式 Caddyfile 保持不变。
#
# 改成仅监听 127.0.0.1，是为了不在局域网/公网上临时暴露这台开发机。
#
# ---------------------------------------------------------------------------
# 用法（必须叠加正式 compose，正式文件不被修改）
# ---------------------------------------------------------------------------
#   docker compose --env-file deploy/.env.verify-local \
#     -f deploy/compose.public.yaml \
#     -f deploy/compose.local-verify.yaml up -d
#
# 验收结论只代表"本机 Docker 构建与容器运行通过"，不代表公网已上线。
# ---------------------------------------------------------------------------
services:
  caddy:
    # !override 替换正式文件里的 ports 列表（默认行为是追加）。
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
